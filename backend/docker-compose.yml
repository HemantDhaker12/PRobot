version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: probot-db
    environment:
      POSTGRES_DB: probot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: probot-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/probot
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PATH=/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: probot-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/probot
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PATH=/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
